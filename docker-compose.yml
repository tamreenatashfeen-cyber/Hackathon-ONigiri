version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: hiringhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: hiring_hub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
